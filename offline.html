<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오프라인 — Sports Grow</title>
<meta name="theme-color" content="#0b1a1e" />
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(520px 320px at 80% 0%, rgba(217, 245, 95, 0.14), transparent 70%),
      #0b1a1e;
    color: #fff;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .card {
    width: min(100%, 420px);
    padding: 34px 28px 30px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    text-align: center;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    display: block;
    margin: 0 auto 20px;
  }
  .eyebrow {
    margin: 0 0 8px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #d9f55f;
  }
  h1 {
    margin: 0;
    font-size: 24px;
    line-height: 1.3;
    letter-spacing: -0.03em;
  }
  p {
    margin: 12px 0 0;
    font-size: 13px;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.68);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 24px;
  }
  button, a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 18px;
    border-radius: 12px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.18s ease;
  }
  button {
    border: 0;
    background: #d9f55f;
    color: #0b1a1e;
  }
  a {
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
  }
  button:hover { background: #c9ea41; }
  a:hover { background: rgba(255, 255, 255, 0.08); }
  button:active, a:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card">
    <img class="mark" src="icons/icon-192.png" alt="" width="64" height="64" />
    <p class="eyebrow">Offline mode</p>
    <h1>오프라인 상태입니다</h1>
    <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br />이미 방문한 화면은 캐시에서 열릴 수 있습니다.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">다시 시도</button>
      <a href="index.html">홈으로</a>
    </div>
  </main>
</body>
</html>
